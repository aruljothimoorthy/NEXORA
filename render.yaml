# Render Blueprint — NEXORA API
# https://render.com/docs/blueprint-spec
# Connect the GitHub repo in Render → New → Blueprint.
# Secrets marked sync: false are entered in the dashboard on first create.

services:
  - type: web
    name: nexora-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MEMORY_MONGO
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      # PORT is injected by Render — do not hardcode
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
